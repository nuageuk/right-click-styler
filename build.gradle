plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.rightclickstyler.RightClickStylerPluginTest'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.rightclickstyler'
version = '1.0-SNAPSHOT'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

// Temporary local validation only: experiment sources are excluded from the production jar.
sourceSets.test.java.srcDir 'experiments'

tasks.withType(Test).configureEach {
	systemProperty 'rightclickstyler.submenuLifecycle',
		project.findProperty('testSubmenuLifecycle') ?: 'hardened'
	systemProperty 'rightclickstyler.submenuTrace',
		project.findProperty('submenuTrace') ?: 'false'
	// Default for overlays the tests do not configure; tests of either mode set it explicitly.
	systemProperty 'rightclickstyler.exactCoverageAuthoritative',
		project.findProperty('testExactAuthoritative') ?: 'true'
	systemProperty 'rightclickstyler.submenuShadow',
		project.findProperty('testSubmenuShadow') ?: 'true'
	systemProperty 'rightclickstyler.exactEvidence',
		project.findProperty('testExactEvidence') ?: 'true'
	// Timing-only tests are skipped unless -Pbenchmark=true; -PwriteProbeGolden=<path> regenerates
	// the probe semantics golden file instead of checking against it.
	systemProperty 'rightclickstyler.benchmark', project.findProperty('benchmark') ?: 'false'
	systemProperty 'rightclickstyler.writeProbeGolden', project.findProperty('writeProbeGolden') ?: ''
	// Probe optimisation level for tests that do not set one (0 = original implementation).
	systemProperty 'rightclickstyler.probeOpt', project.findProperty('testProbeOpt') ?: '4'
	outputs.upToDateWhen { !project.hasProperty('benchmark') && !project.hasProperty('writeProbeGolden') }
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea", "-Drightclickstyler.submenuPrototype=${project.findProperty('submenuPrototype') ?: 'true'}",
		"-Drightclickstyler.submenuTrace=${project.findProperty('submenuTrace') ?: 'false'}",
		"-Drightclickstyler.submenuLifecycle=${project.findProperty('submenuLifecycle') ?: 'hardened'}",
		"-Drightclickstyler.exactCoverageAuthoritative=${project.findProperty('exactAuthoritative') ?: 'true'}",
		"-Drightclickstyler.imageCache=${project.findProperty('imageCache') ?: 'true'}",
		"-Drightclickstyler.imageCacheVerify=${project.findProperty('imageCacheVerify') ?: '0'}",
		"-Drightclickstyler.perfTrace=${project.findProperty('perfTrace') ?: 'false'}",
		"-Drightclickstyler.probeOpt=${project.findProperty('probeOpt') ?: '4'}"
	args "--developer-mode", "--debug"
}

tasks.register('runDiagnostic', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.rightclickstyler.SubmenuDiagnosticLauncher'
	jvmArgs '-ea', "-Drightclickstyler.submenuProbe=${project.findProperty('submenuProbe') ?: 'true'}"
	args '--developer-mode', '--debug'
}

tasks.register('runSubmenuHarness', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'experiments.SubmenuRasterProbeHarness'
	jvmArgs '-ea'
}

tasks.register('benchmarkSubmenuPrototype', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.rightclickstyler.MenuOverlayTest'
	jvmArgs '-ea'
	if (project.hasProperty('benchmarkMode')) {
		args project.property('benchmarkMode').toString()
	}
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'
	exclude 'experiments/**'
	exclude 'com/rightclickstyler/SubmenuDiagnostic*'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
